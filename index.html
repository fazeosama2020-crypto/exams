<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الاختبارات - مدرسة عبيدة بن الحارث</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<!-- Firebase Compat (no module needed) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--g:#0A3D2E;--g2:#1A5C44;--gold:#C9A84C;--gold2:#E8C97A;--cream:#FDF8EE;--red:#B91C1C}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#f0f4f0;min-height:100vh}
/* LOGIN */
.login-screen{position:fixed;inset:0;background:linear-gradient(145deg,var(--g),#0F5C45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:999}
.login-box{background:white;border-radius:20px;padding:32px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.4),0 0 0 3px var(--gold)}
.login-emblem{width:65px;height:65px;border-radius:50%;background:linear-gradient(145deg,var(--gold2),var(--gold));display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 10px}
.login-title{font-size:1.2rem;font-weight:900;color:var(--g);text-align:center;margin-bottom:3px}
.login-sub{font-size:0.75rem;color:#999;text-align:center;margin-bottom:16px}
.login-tabs{display:flex;background:#f3f4f6;border-radius:10px;padding:4px;margin-bottom:14px;gap:4px}
.tab-btn{flex:1;padding:9px;border-radius:7px;border:none;font-family:'Cairo',sans-serif;font-size:0.85rem;font-weight:700;cursor:pointer;color:#666;background:transparent;transition:all .2s}
.tab-btn.active{background:white;color:var(--g);box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.inp{width:100%;padding:11px 13px;border-radius:9px;border:1.5px solid #e5e7eb;font-family:'Cairo',sans-serif;font-size:0.9rem;color:var(--g);margin-bottom:9px;outline:none;text-align:right;background:var(--cream)}
.inp:focus{border-color:var(--gold)}
.inp-label{font-size:0.7rem;font-weight:700;color:var(--g2);display:block;margin-bottom:3px}
.l-btn{width:100%;padding:13px;background:linear-gradient(135deg,#9A7B2F,var(--gold));color:white;border:none;border-radius:10px;font-family:'Cairo',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;margin-top:4px}
.l-err{color:var(--red);font-size:0.8rem;margin-bottom:8px;display:none;text-align:center;padding:6px;background:#fee2e2;border-radius:6px}
/* APP */
#app{display:none;min-height:100vh}
.top-bar{background:var(--g);color:white;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.2)}
.top-logo{font-size:1rem;font-weight:900;color:var(--gold2)}
.breadcrumb{font-size:0.72rem;color:rgba(255,255,255,0.55);margin-top:1px}
.user-chip{background:rgba(201,168,76,0.2);border:1px solid rgba(201,168,76,0.4);border-radius:50px;padding:4px 11px;font-size:0.72rem;color:var(--gold2);font-weight:700}
.logout-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:6px 12px;color:white;font-family:'Cairo',sans-serif;font-size:0.75rem;cursor:pointer}
.main{max-width:900px;margin:0 auto;padding:18px}
/* STATS BAR */
.stats-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.stat-mini{background:white;border-radius:10px;padding:10px 14px;text-align:center;flex:1;min-width:55px;border:1.5px solid #e5e7eb}
.stat-mini-n{font-size:1.3rem;font-weight:900;color:var(--g)}
.stat-mini-l{font-size:0.62rem;color:#888}
/* DASH GRID */
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
@media(max-width:650px){.dash-grid{grid-template-columns:repeat(2,1fr)}}
.dash-card{background:white;border-radius:13px;padding:20px 14px;text-align:center;cursor:pointer;border:1.5px solid #e5e7eb;transition:all .2s}
.dash-card:hover,.dash-card:active{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 6px 20px rgba(10,61,46,0.1)}
.dash-icon{font-size:2rem;margin-bottom:7px}
.dash-label{font-size:0.82rem;font-weight:800;color:var(--g)}
.dash-sub{font-size:0.62rem;color:#aaa;margin-top:3px}
/* SECTION */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid rgba(201,168,76,0.3)}
.sec-head h2{font-size:1.05rem;font-weight:900;color:var(--g)}
.list-item{background:white;border-radius:11px;padding:13px 15px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;border:1.5px solid #f0f0f0;gap:8px}
.list-item:hover{border-color:var(--gold)}
.li-title{font-size:0.88rem;font-weight:800;color:var(--g)}
.li-sub{font-size:0.7rem;color:#888;margin-top:2px}
.li-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}
.empty{text-align:center;padding:36px;color:#bbb;font-size:0.88rem}
.loading{text-align:center;padding:36px;color:#888}
/* BTNS */
.btn{border:none;border-radius:8px;font-family:'Cairo',sans-serif;font-weight:700;cursor:pointer;transition:all .2s}
.btn-gold{background:linear-gradient(135deg,#9A7B2F,var(--gold));color:white;padding:9px 16px;font-size:0.83rem}
.btn-green{background:var(--g2);color:white;padding:9px 16px;font-size:0.83rem}
.btn-red{background:var(--red);color:white;padding:9px 16px;font-size:0.83rem}
.btn-gray{background:#e5e7eb;color:#333;padding:9px 16px;font-size:0.83rem}
.btn-sm{padding:5px 10px;font-size:0.72rem}
.btn-lg{width:100%;padding:13px;font-size:0.95rem;margin-top:16px}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:9999;padding:14px}
.modal-overlay.open{display:flex}
.modal-box{background:white;border-radius:15px;padding:22px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
.modal-box h3{font-size:1rem;font-weight:900;color:var(--g);margin-bottom:12px}
.modal-btns{display:flex;gap:7px;justify-content:flex-end;margin-top:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:4px}
@media(max-width:500px){.row2{grid-template-columns:1fr}}
/* QUESTIONS */
.q-editor{background:#f8faf8;border:1.5px solid #e0e0e0;border-radius:10px;padding:12px;margin-bottom:9px}
.q-head{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.q-badge{background:var(--g);color:white;border-radius:20px;padding:3px 9px;font-size:0.68rem;font-weight:700}
.q-num{font-size:0.72rem;color:#888;flex:1}
.add-q-btns{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
/* STATUS */
.s-badge{display:inline-block;border-radius:20px;padding:3px 9px;font-size:0.7rem;font-weight:700;margin-top:3px}
.s-open{background:#dcfce7;color:#16a34a}
.s-closed{background:#fee2e2;color:#dc2626}
.s-upcoming{background:#dbeafe;color:#1d4ed8}
/* RESULTS */
.result-block{background:white;border-radius:11px;margin-bottom:11px;border:1.5px solid #e5e7eb;overflow:hidden}
.result-head{padding:13px 15px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}
.result-head:hover{background:#f8f8f8}
.r-title{font-size:0.9rem;font-weight:800;color:var(--g)}
.r-sub{font-size:0.7rem;color:#888;margin-top:2px}
.r-stats{display:flex;gap:5px;flex-wrap:wrap}
.r-detail{padding:13px 15px;border-top:1px solid #f0f0f0;display:none}
.pill{border-radius:20px;padding:3px 9px;font-size:0.7rem;font-weight:700}
.pill-g{background:#dcfce7;color:#16a34a}
.pill-gold{background:#fef3c7;color:#92400e}
.pill-r{background:#fee2e2;color:#dc2626}
.tbl{width:100%;border-collapse:collapse;font-size:0.8rem}
.tbl th{background:var(--g);color:white;padding:8px 10px;text-align:right;font-weight:700}
.tbl td{padding:8px 10px;border-bottom:1px solid #f0f0f0;text-align:right}
.tbl tr:nth-child(even) td{background:#fafafa}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}
@media(max-width:500px){.stats4{grid-template-columns:1fr 1fr}}
.stat-box{background:white;border-radius:11px;padding:13px;text-align:center;border:1.5px solid #e5e7eb}
.stat-n{font-size:1.6rem;font-weight:900;color:var(--g)}
.stat-l{font-size:0.66rem;color:#888;margin-top:2px}
.q-stat-row{background:#f8f8f8;border-radius:8px;padding:9px 11px;margin-bottom:7px}
.q-stat-text{font-size:0.8rem;font-weight:700;color:var(--g);margin-bottom:5px}
.bar-wrap{background:#e5e7eb;border-radius:50px;height:7px;margin-bottom:4px}
.bar-fill{background:var(--gold);height:7px;border-radius:50px}
.q-stat-pct{font-size:0.7rem;color:#666}
.sec-h3{font-size:0.92rem;font-weight:900;color:var(--g);margin:14px 0 8px}
/* SCHEDULE */
.sched-tag{font-size:0.85rem;font-weight:900;padding:7px 12px;border-radius:8px;margin:12px 0 8px;display:inline-block}
.tag-open{background:#dcfce7;color:#16a34a}
.tag-soon{background:#dbeafe;color:#1d4ed8}
.tag-past{background:#f3f4f6;color:#666}
.sched-row{background:white;border-radius:11px;padding:12px 14px;margin-bottom:7px;display:flex;align-items:center;gap:10px;border:1.5px solid #e5e7eb}
.sched-row.open{border-color:#86efac}
.sched-row.upcoming{border-color:#93c5fd}
.sched-icon{font-size:1.5rem}
.sched-info{flex:1}
.sched-name{font-size:0.85rem;font-weight:800;color:var(--g)}
.sched-sub{font-size:0.7rem;color:#888;margin-top:2px}
.sched-time{font-size:0.68rem;color:#666;margin-top:2px}
/* LEADERBOARD */
.lb-row{background:white;border-radius:11px;padding:12px 15px;display:flex;align-items:center;gap:10px;border:1.5px solid #e5e7eb;margin-bottom:8px}
.lb-row.top3{border-color:var(--gold);background:linear-gradient(135deg,white,#fffdf0)}
.lb-rank{font-size:1.4rem;min-width:34px;text-align:center}
.lb-name{font-size:0.88rem;font-weight:800;color:var(--g)}
.lb-id{font-size:0.68rem;color:#888;margin-top:2px}
.lb-avg{font-size:1.3rem;font-weight:900;color:var(--g)}
.lb-max{font-size:0.65rem;color:#888}
/* MESSAGES */
.msg-card{background:white;border-radius:11px;padding:14px;border:1.5px solid #e5e7eb;margin-bottom:10px}
.msg-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.msg-type{border-radius:20px;padding:3px 10px;font-size:0.72rem;font-weight:700}
.mt-ann{background:#dbeafe;color:#1d4ed8}
.mt-warn{background:#fee2e2;color:#dc2626}
.mt-rem{background:#fef3c7;color:#92400e}
.msg-title{font-size:0.88rem;font-weight:800;color:var(--g);margin-bottom:4px}
.msg-body{font-size:0.8rem;color:#444;margin-bottom:10px;line-height:1.5}
/* BUILTIN */
.builtin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
@media(max-width:550px){.builtin-grid{grid-template-columns:1fr}}
.builtin-card{background:white;border-radius:13px;padding:20px;text-align:center;border:2px solid;cursor:pointer;transition:all .22s}
.builtin-card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,0.1)}
.b-icon{font-size:2.4rem;margin-bottom:7px}
.b-name{font-size:0.95rem;font-weight:900;color:var(--g)}
.b-count{font-size:0.7rem;color:#888;margin-top:3px}
.tmpl-card{background:white;border-radius:12px;margin-bottom:12px;border:1.5px solid #e5e7eb;overflow:hidden}
.tmpl-head{padding:13px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f0f0}
.tmpl-title{font-size:0.88rem;font-weight:800;color:var(--g)}
.tmpl-sub{font-size:0.7rem;color:#888;margin-top:2px}
.tmpl-preview{padding:11px 15px;background:#f9fafb}
.prev-q{font-size:0.75rem;color:#555;padding:4px 0;border-bottom:1px dashed #e5e7eb}
.prev-q:last-child{border:none}
.q-type-mini{background:#e8f5e9;border-radius:20px;padding:1px 6px;font-size:0.63rem;color:var(--g2)}
/* STUDENT */
.stud-msgs{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.stud-msg{padding:9px 12px;border-radius:8px;font-size:0.78rem;font-weight:600;border-right:3px solid}
.sm-ann{background:#dbeafe;color:#1d4ed8;border-color:#1d4ed8}
.sm-warn{background:#fee2e2;color:#b91c1c;border-color:#b91c1c}
.sm-rem{background:#fef3c7;color:#92400e;border-color:#92400e}
.subj-card{background:white;border-radius:13px;padding:14px;margin-bottom:12px;border:1.5px solid #e5e7eb}
.subj-title{font-size:0.98rem;font-weight:900;color:var(--g);margin-bottom:2px}
.subj-teacher{font-size:0.7rem;color:#888;margin-bottom:10px}
.exam-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#f8faf8;border-radius:9px;margin-bottom:6px;border:1px solid #e8e8e8;gap:8px}
.exam-name{font-size:0.83rem;font-weight:700;color:var(--g)}
.exam-time{font-size:0.67rem;color:#999;margin-top:2px}
/* EXAM INTERFACE */
.exam-wrap{max-width:680px;margin:0 auto}
.exam-top{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;background:var(--g);border-radius:11px;margin-bottom:15px;color:white}
.exam-top h2{font-size:0.98rem;font-weight:900;color:var(--gold2)}
.exam-timer{font-size:1.3rem;font-weight:900;color:var(--gold2);font-variant-numeric:tabular-nums}
.exam-q{background:white;border-radius:11px;padding:14px 16px;margin-bottom:11px;border:1.5px solid #e5e7eb}
.qn-badge{font-size:0.73rem;font-weight:700;color:var(--g2);margin-bottom:6px;display:flex;gap:5px;align-items:center}
.qt-sm{background:#e8f5e9;border-radius:20px;padding:2px 7px;font-size:0.63rem}
.qp-sm{background:#fef3c7;border-radius:20px;padding:2px 7px;font-size:0.63rem;color:#92400e}
.q-text{font-size:0.9rem;font-weight:600;color:#1a1a1a;margin-bottom:9px;line-height:1.5}
.choice{display:flex;align-items:center;gap:7px;padding:8px 11px;border:1.5px solid #e5e7eb;border-radius:8px;margin-bottom:5px;cursor:pointer;font-size:0.83rem;transition:all .15s}
.choice:hover{border-color:var(--gold);background:#fffbf0}
.choice input{accent-color:var(--gold)}
/* RESULT SCREEN */
.result-screen{text-align:center;padding:36px 18px;max-width:400px;margin:0 auto}
.result-circle{width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 18px;border:5px solid}
.rc-pass{border-color:#16a34a;background:#dcfce7}
.rc-fail{border-color:#dc2626;background:#fee2e2}
.result-pct{font-size:2rem;font-weight:900;color:var(--g)}
.result-grade{font-size:0.83rem;color:#666}
.result-screen h2{font-size:1.2rem;font-weight:900;color:var(--g);margin-bottom:6px}
.result-screen p{color:#666;margin-bottom:18px}
.pct-pill{border-radius:20px;padding:3px 10px;font-size:0.73rem;font-weight:700}
.pp-pass{background:#dcfce7;color:#16a34a}
.pp-fail{background:#fee2e2;color:#dc2626}
/* TOAST */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--g);color:white;padding:9px 22px;border-radius:50px;font-size:0.8rem;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,0.2);border:1.5px solid var(--gold);z-index:9998;transition:transform .3s;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modal"></div>

<!-- LOGIN -->

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-emblem">🕌</div>
    <div class="login-title">مدرسة عبيدة بن الحارث</div>
    <div class="login-sub">نظام الاختبارات الإلكترونية</div>
    <div class="login-tabs">
      <button class="tab-btn active" id="tabTeacher">معلم / مدير</button>
      <button class="tab-btn" id="tabStudent">طالب</button>
    </div>
    <div id="panelTeacher">
      <input class="inp" id="lEmail" type="email" placeholder="البريد الإلكتروني" dir="ltr" autocomplete="email">
      <input class="inp" id="lPass" type="password" placeholder="كلمة المرور" dir="ltr" autocomplete="current-password">
      <div class="l-err" id="loginErr"></div>
      <button class="l-btn" id="btnLogin">🔐 دخول</button>
    </div>
    <div id="panelStudent" style="display:none">
      <input class="inp" id="sId" type="tel" placeholder="رقم الهوية (10 أرقام)" dir="ltr" maxlength="10">
      <input class="inp" id="sName" type="text" placeholder="الاسم الكامل">
      <div class="l-err" id="studentErr"></div>
      <button class="l-btn" id="btnStudentLogin">▶ دخول الطالب</button>
    </div>
  </div>
</div>

<!-- APP -->

<div id="app">
  <div class="top-bar">
    <div>
      <div class="top-logo">🕌 نظام الاختبارات</div>
      <div class="breadcrumb" id="breadcrumb">لوحة التحكم</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="user-chip" id="userChip">—</div>
      <button class="logout-btn" id="btnLogout">خروج</button>
    </div>
  </div>
  <div class="main" id="mainContent"><div class="loading">⏳ جاري التحميل...</div></div>
</div>

// ===== AUTH =====
auth.onAuthStateChanged(async user=>{
  if(user){
    currentUser=user;
    try{
      const snap=await db.collection('users').doc(user.uid).get();
      if(snap.exists){userProfile=snap.data();userRole=userProfile.role;}
      else{userRole=ADMIN_EMAILS.includes(user.email)?'admin':'teacher';userProfile={email:user.email,role:userRole,name:user.email};}
    }catch(e){userRole='admin';userProfile={email:user.email,role:'admin',name:user.email};}
    showApp();
  } else {
    currentUser=null;userRole=null;
    document.getElementById('app').style.display='none';
    document.getElementById('loginScreen').style.display='flex';
  }
});

document.getElementById('tabTeacher').onclick=()=>{

};
document.getElementById('btnLogin').onclick=async()=>{
  const e=document.getElementById('lEmail').value.trim();
  const p=document.getElementById('lPass').value;
  const errEl=document.getElementById('loginErr');
  errEl.style.display='none';
  if(!e||!p){showErr('loginErr','يرجى إدخال البيانات');return;}
  document.getElementById('btnLogin').textContent='⏳ جاري الدخول...';
  try{await auth.signInWithEmailAndPassword(e,p);}
  catch(err){showErr('loginErr',trErr(err.code));document.getElementById('btnLogin').textContent='🔐 دخول';}
};
document.getElementById('btnStudentLogin').onclick=async()=>{
  const sid=document.getElementById('sId').value.trim();
  const name=document.getElementById('sName').value.trim();
  if(!sid||!name){showErr('studentErr','يرجى إدخال رقم الهوية والاسم');return;}
  if(!/^\d{10}$/.test(sid)){showErr('studentErr','رقم الهوية يجب أن يكون 10 أرقام');return;}
  document.getElementById('btnStudentLogin').textContent='⏳ جاري الدخول...';
  const email=sid+'@student.school.edu', pass='student_'+sid;
  try{
    try{await auth.signInWithEmailAndPassword(email,pass);}
    catch{
      await auth.createUserWithEmailAndPassword(email,pass);
      await db.collection('users').doc(auth.currentUser.uid).set({name,studentId:sid,role:'student',email,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    }
  }catch(err){showErr('studentErr','خطأ: '+err.message);document.getElementById('btnStudentLogin').textContent='▶ دخول الطالب';}
};
document.getElementById('btnLogout').onclick=async()=>{
  if(confirm('هل تريد الخروج؟'))await auth.signOut();
};
// Enter key
document.addEventListener('keydown',e=>{

});

async function saveExam(subjectId){
const title=V(‘eTitle’);if(!title){alert(‘أدخل عنوان الاختبار’);return;}
const questions=[];
document.querySelectorAll(’.q-editor’).forEach(el=>{
const q={type:el.dataset.type,id:Date.now()+Math.random()};
el.querySelectorAll(’[data-f]’).forEach(f=>q[f.dataset.f]=f.value);
if(q.text)questions.push(q);
});
if(!questions.length){alert(‘أضف سؤالاً واحداً على الأقل’);return;}
await db.collection(‘exams’).add({title,subjectId,questions,openAt:V(‘eOpen’)||null,closeAt:V(‘eClose’)||null,duration:V(‘eDur’)?parseInt(V(‘eDur’)):null,createdBy:currentUser.uid,createdAt:TS()});
qCount=0;closeModal();toast(‘✅ تم حفظ الاختبار’);showAllExams();
}

(e.questions||[]).forEach(q=>{addQ(q.type);const els=document.querySelectorAll(’.q-editor’);const last=els[els.length-1];last.querySelectorAll(’[data-f]’).forEach(el=>{if(q[el.dataset.f]!==undefined)el.value=q[el.dataset.f];});});
}
async function updateExam(examId,subjectId,subjectName){
const questions=[];
document.querySelectorAll(’.q-editor’).forEach(el=>{
const q={type:el.dataset.type,id:Date.now()+Math.random()};

if(q.text)questions.push(q);
});
await db.collection(‘exams’).doc(examId).update({title:V(‘eTitle’),openAt:V(‘eOpen’)||null,closeAt:V(‘eClose’)||null,duration:V(‘eDur’)?parseInt(V(‘eDur’)):null,questions,updatedAt:TS()});

const [snap,sSnap]=await Promise.all([db.collection(‘exams’).get(),db.collection(‘subjects’).get()]);
const subs={};sSnap.forEach(d=>subs[d.id]=d.data());
const now=new Date();const open=[],upcoming=[],past=[];
snap.forEach(d=>{const e={…d.data(),id:d.id};const o=e.openAt?new Date(e.openAt):null,cl=e.closeAt?new Date(e.closeAt):null;
if(o&&cl){if(now<o)upcoming.push(e);else if(now>cl)past.push(e);else open.push(e);}else upcoming.push(e);});
upcoming.sort((a,b)=>new Date(a.openAt||0)-new Date(b.openAt||0));
let h=’<div class="sec-head"><h2>📅 جدول الاختبارات</h2></div>’;
if(!open.length&&!upcoming.length&&!past.length){h+=’<div class="empty">لا توجد اختبارات مجدولة</div>’;C(h);return;}
if(open.length){h+=`<div class="sched-tag tag-open">🟢 مفتوحة الآن (${open.length})</div>`;open.forEach(e=>{h+=SR(e,subs[e.subjectId],‘open’);});}
if(upcoming.length){h+=`<div class="sched-tag tag-soon">🔵 القادمة (${upcoming.length})</div>`;upcoming.forEach(e=>{h+=SR(e,subs[e.subjectId],‘upcoming’);});}
if(past.length){h+=`<div class="sched-tag tag-past">⚫ المنتهية (${past.length})</div>`;past.slice(0,6).forEach(e=>{h+=SR(e,subs[e.subjectId],‘past’);});}
C(h);
}
function SR(e,sub,status){
const o=e.openAt?new Date(e.openAt):null,cl=e.closeAt?new Date(e.closeAt):null;
return`<div class="sched-row ${status}"> <div class="sched-icon">${sub?.icon||'📝'}</div> <div class="sched-info"> <div class="sched-name">${e.title}</div> <div class="sched-sub">${sub?.name||'—'} | ${e.questions?.length||0} سؤال</div> <div class="sched-time">${o?'🕐 '+o.toLocaleString('ar-SA'):''} ${cl?'— '+cl.toLocaleString('ar-SA'):''}</div> </div> ${status==='open'?`<button class="btn btn-gold btn-sm" onclick="showExamResults('${e.id}','${esc(e.title)}')">النتائج</button>`:’’}

  </div>`;
}

async function showExamResults(examId,examTitle){

  ${ans.sort((a,b)=>(b.score||0)-(a.score||0)).map(a=>`<tr><td>${a.studentName||'—'}</td><td>${a.studentId||'—'}</td><td><b>${a.score||0}</b>/${a.total||0}</td><td>${a.submittedAt?new Date(a.submittedAt).toLocaleDateString('ar-SA'):'—'}</td></tr>`).join('')}
  </tbody></table>
  <button class="btn btn-gold btn-sm" style="margin-top:10px" onclick="exportCSV('${examId}')">⬇️ تصدير Excel</button>`;
  C(h);
}

async function startExam(examId){
  const snap=await db.collection('exams').doc(examId).get();if(!snap.exists)return;
  const exam=snap.data();const now=new Date();
  const cl=exam.closeAt?new Date(exam.closeAt):null;
  if(cl&&now>cl){alert('انتهى وقت الاختبار');return;}
  const prev=await db.collection('answers').where('examId','==',examId).where('studentUid','==',currentUser.uid).get();
  if(!prev.empty){alert('أجبت على هذا الاختبار من قبل');viewMyResult(examId);return;}
  showExamUI(examId,exam);
}
function showExamUI(examId,exam){
  BC('الاختبار: '+exam.title);
  let rem=exam.duration?exam.duration*60:null;
  let h=`<div class="exam-wrap"><div class="exam-top"><h2>${exam.title}</h2><div id="examTimer" class="exam-timer">${rem?fmt(rem):''}</div></div><form id="examForm">`;
  exam.questions.forEach((q,i)=>{
    const lbl={mcq:'اختيار',tf:'ص/خ',fill:'فراغ',essay:'مقالي'}[q.type];
    h+=`<div class="exam-q"><div class="qn-badge">س${i+1} <span class="qt-sm">${lbl}</span> <span class="qp-sm">${q.points||1} درجة</span></div><div class="q-text">${q.text}</div>`;
    if(q.type==='mcq')['a','b','c','d'].forEach(op=>{if(q[op])h+=`<label class="choice"><input type="radio" name="q_${q.id}" value="${op}"> ${q[op]}</label>`;});
    else if(q.type==='tf')h+=`<label class="choice"><input type="radio" name="q_${q.id}" value="true"> صح</label><label class="choice"><input type="radio" name="q_${q.id}" value="false"> خطأ</label>`;
    else if(q.type==='fill')h+=`<input class="inp" name="q_${q.id}" placeholder="إجابتك">`;
    else h+=`<textarea class="inp" name="q_${q.id}" rows="4" placeholder="إجابتك"></textarea>`;
    h+='</div>';
  });
  h+=`</form><button class="btn btn-gold btn-lg" onclick="submitExam('${examId}')">تسليم الاختبار ✓</button></div>`;
  C(h);
  if(rem){const t=setInterval(()=>{rem--;const el=document.getElementById('examTimer');if(el)el.textContent=fmt(rem);if(rem<=0){clearInterval(t);document.querySelector(`[onclick="submitExam('${examId}')"]`)?.click();}},1000);}
}
async function submitExam(examId){
  if(!confirm('هل تريد التسليم؟ لن تستطيع التعديل بعد ذلك.'))return;
  const snap=await db.collection('exams').doc(examId).get();const exam=snap.data();
  const form=document.getElementById('examForm');
  let score=0,total=0;const answers=[];
  exam.questions.forEach(q=>{
    const pts=parseInt(q.points)||1;total+=pts;
    let ans=null,isCorrect=false;
    if(q.type==='mcq'||q.type==='tf'){const c=form.querySelector(`input[name="q_${q.id}"]:checked`);ans=c?c.value:null;isCorrect=ans===q.correct;}
    else if(q.type==='fill'){const inp=form.querySelector(`input[name="q_${q.id}"]`);ans=inp?inp.value.trim():'';isCorrect=ans.toLowerCase()===(q.correct||'').toLowerCase();}
    else{const ta=form.querySelector(`textarea[name="q_${q.id}"]`);ans=ta?ta.value.trim():'';}
    if(isCorrect)score+=pts;
    answers.push({qid:q.id,answer:ans,isCorrect,points:pts});
  });
  await db.collection('answers').add({examId,studentUid:currentUser.uid,studentName:userProfile?.name||'—',studentId:userProfile?.studentId||'—',answers,score,total,submittedAt:new Date().toISOString()});
  const pct=Math.round(score/total*100);
  C(`<div class="result-screen">
    <div class="result-circle ${pct>=60?'rc-pass':'rc-fail'}"><div class="result-pct">${pct}%</div><div class="result-grade">${score}/${total}</div></div>
    <h2>${pct>=60?'🎉 أحسنت!':'📚 استمر في المذاكرة'}</h2>
    <p>حصلت على <b>${score}</b> من <b>${total}</b> درجة</p>
    <button class="btn btn-gold" onclick="showStudentDash()">← العودة للاختبارات</button>
  </div>`);
}
async function viewMyResult(examId){
  const snap=await db.collection('answers').where('examId','==',examId).where('studentUid','==',currentUser.uid).get();
  if(snap.empty){alert('لا توجد نتيجة');return;}
  const a=snap.docs[0].data();const pct=Math.round((a.score||0)/(a.total||1)*100);
  C(`<div class="result-screen">
    <div class="result-circle ${pct>=60?'rc-pass':'rc-fail'}"><div class="result-pct">${pct}%</div><div class="result-grade">${a.score}/${a.total}</div></div>
    <h2>نتيجتك في هذا الاختبار</h2>
    <p><b>${a.score}</b> من <b>${a.total}</b> درجة</p>
    <button class="btn btn-gold" onclick="showStudentDash()">← العودة</button>
  </div>`);
}

function TS(){return firebase.firestore.FieldValue.serverTimestamp();}
function esc(s){return String(s).replace(/’/g,”\’”).replace(/”/g,’"’);}

function fmt(s){return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function showErr(id,msg){const el=document.getElementById(id);if(el){el.textContent=msg;el.style.display=‘block’;}}
function toast(msg){const t=document.getElementById(‘toast’);t.textContent=msg;t.classList.add(‘show’);setTimeout(()=>t.classList.remove(‘show’),3000);}
function toggleD(id){const el=document.getElementById(id);el.style.display=el.style.display===‘none’||!el.style.display?‘block’:‘none’;}
function openModal(html){const m=document.getElementById(‘modal’);m.innerHTML=`<div class="modal-box">${html}</div>`;m.classList.add(‘open’);}
function closeModal(){document.getElementById(‘modal’).classList.remove(‘open’);qCount=0;}
function trErr(c){return({‘auth/invalid-credential’:‘إيميل أو كلمة مرور خاطئة’,‘auth/user-not-found’:‘الحساب غير موجود’,‘auth/wrong-password’:‘كلمة المرور خاطئة’,‘auth/invalid-email’:‘صيغة الإيميل غير صحيحة’})[c]||‘خطأ في الدخول’;}
// close modal on backdrop click
document.getElementById(‘modal’).addEventListener(‘click’,function(e){if(e.target===this)closeModal();});
</script>
