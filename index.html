let currentUser=null, userRole=null, userProfile=null, qCount=0;

onAuthStateChanged(auth, async user=>{
if(user){
currentUser=user;
const snap=await getDoc(doc(db,‘users’,user.uid));
if(snap.exists()){userProfile=snap.data();userRole=userProfile.role;}
else{userRole=ADMIN_EMAILS.includes(user.email)?‘admin’:‘teacher’;userProfile={email:user.email,role:userRole,name:user.email};}
showApp();
} else { currentUser=null;userRole=null;showLogin(); }
});

window.doLogin=async()=>{
const e=document.getElementById(‘lEmail’).value.trim(), p=document.getElementById(‘lPass’).value;
if(!e||!p){showErr(‘loginErr’,‘يرجى إدخال البيانات’);return;}
try{await signInWithEmailAndPassword(auth,e,p);}catch(err){showErr(‘loginErr’,translateErr(err.code));}
};
window.doStudentLogin=async()=>{
const sid=document.getElementById(‘studentId’).value.trim(), name=document.getElementById(‘studentName’).value.trim();
if(!sid||!name){showErr(‘studentErr’,‘يرجى إدخال رقم الهوية والاسم’);return;}
if(!/^\d{10}$/.test(sid)){showErr(‘studentErr’,‘رقم الهوية 10 أرقام’);return;}
try{
const email=sid+’@student.school.edu’, pass=‘student_’+sid;
try{await signInWithEmailAndPassword(auth,email,pass);}
catch{
await createUserWithEmailAndPassword(auth,email,pass);
await setDoc(doc(db,‘users’,auth.currentUser.uid),{name,studentId:sid,role:‘student’,email,createdAt:serverTimestamp()});
}
}catch(err){showErr(‘studentErr’,‘خطأ: ‘+err.message);}
};
window.doLogout=async()=>{if(confirm(‘هل تريد الخروج؟’))await signOut(auth);};
window.switchLoginTab=tab=>{
document.getElementById(‘teacherTab’).classList.toggle(‘active’,tab===‘teacher’);
document.getElementById(‘studentTab’).classList.toggle(‘active’,tab===‘student’);
document.getElementById(‘teacherPanel’).style.display=tab===‘teacher’?’’:‘none’;
document.getElementById(‘studentPanel’).style.display=tab===‘student’?’’:‘none’;
};

function showLogin(){document.getElementById(‘app’).style.display=‘none’;document.getElementById(‘loginScreen’).style.display=‘flex’;}
function showApp(){
document.getElementById(‘loginScreen’).style.display=‘none’;
document.getElementById(‘app’).style.display=‘block’;
document.getElementById(‘userNameBar’).textContent=userProfile?.name||currentUser.email;
document.getElementById(‘userRoleBar’).textContent=userRole===‘admin’?‘مدير’:userRole===‘teacher’?‘معلم’:‘طالب’;
if(userRole===‘student’) showStudentDashboard();
else showAdminDashboard();
}

// Get or create subject in DB
const snap=await getDocs(query(collection(db,‘subjects’),where(‘name’,’==’,sub.name)));
let subjectId=null;
if(!snap.empty) subjectId=snap.docs[0].id;
let html=`<div class="section-header"><h2>${sub.icon} ${sub.name} — النماذج الجاهزة</h2>
<button class="btn-gold" onclick="showBuiltinSubjects()">← رجوع</button></div>

  <p style="color:#666;font-size:0.82rem;margin-bottom:14px">اختر نموذجاً وعدّله وأضف وقت الفتح والإغلاق ثم احفظه</p>`;
  sub.templates.forEach((tmpl,i)=>{
    html+=`<div class="template-card">
      <div class="template-header">
        <div>
          <div class="template-title">${sub.icon} ${tmpl.title}</div>
          <div class="template-sub">${tmpl.questions.length} سؤال</div>
        </div>
        <button class="btn-gold" onclick="useTemplate('${key}',${i})">استخدام هذا النموذج ▶</button>

        ${tmpl.questions.map((q,qi)=>`<div class="preview-q"><b>س${qi+1}:</b> ${q.text} <span class="q-type-badge-sm">${{mcq:'متعدد',tf:'ص/خ',fill:'فراغ',essay:'مقالي'}[q.type]}</span></div>`).join('')}
      </div>
    </div>`;
  });
  C(html);

window.useTemplate=async(key,idx)=>{
const sub=BUILTIN_SUBJECTS[key];
const tmpl=sub.templates[idx];
// Ensure subject exists
let subjectId=null;
const snap=await getDocs(query(collection(db,‘subjects’),where(‘name’,’==’,sub.name)));
if(!snap.empty){subjectId=snap.docs[0].id;}
else{const ref=await addDoc(collection(db,‘subjects’),{name:sub.name,icon:sub.icon,teacher:’—’,grade:’—’,createdAt:serverTimestamp()});subjectId=ref.id;}
// Show edit form with template pre-filled
const modal=document.getElementById(‘modal’);
modal.innerHTML=`<div class="modal-box large">
<h3>${sub.icon} إضافة: ${tmpl.title}</h3>
<input class="inp" id="eTitle" value="${tmpl.title}" placeholder="عنوان الاختبار">
<div class="row-2">
<div><label class="inp-label">وقت الفتح</label><input class="inp" type="datetime-local" id="eOpen"></div>
<div><label class="inp-label">وقت الإغلاق</label><input class="inp" type="datetime-local" id="eClose"></div>
</div>
<input class="inp" id="eDuration" placeholder="مدة الاختبار بالدقائق" type="number" value="45">
<div id="questionsContainer"></div>
<div class="add-q-btns">
<button class="btn-sm btn-green" onclick="addQuestion('mcq')">+ متعدد</button>
<button class="btn-sm btn-green" onclick="addQuestion('tf')">+ صح/خطأ</button>
<button class="btn-sm btn-green" onclick="addQuestion('fill')">+ فراغ</button>
<button class="btn-sm btn-green" onclick="addQuestion('essay')">+ مقالي</button>
</div>
<div class="modal-btns">
<button class="btn-gold" onclick="saveExam('${subjectId}')">حفظ الاختبار</button>
<button class="btn-gray" onclick="closeModal()">إلغاء</button>
</div>

  </div>`;
  modal.style.display='flex';
  tmpl.questions.forEach(q=>{
    addQuestion(q.type);
    const qels=document.querySelectorAll('.question-editor');
    const last=qels[qels.length-1];
    last.querySelectorAll('[data-field]').forEach(el=>{if(q[el.dataset.field]!==undefined)el.value=q[el.dataset.field];});
  });
};

window.showAddSubjectForm=()=>{
M(`<h3>إضافة مادة جديدة</h3> <input class="inp" id="sName" placeholder="اسم المادة"> <input class="inp" id="sTeacher" placeholder="اسم المعلم"> <input class="inp" id="sGrade" placeholder="الصف الدراسي"> <input class="inp" id="sIcon" placeholder="رمز (مثال: 📐)"> <div class="modal-btns"> <button class="btn-gold" onclick="saveSubject()">حفظ</button> <button class="btn-gray" onclick="closeModal()">إلغاء</button> </div>`);
};

window.saveSubject=async()=>{
const name=document.getElementById(‘sName’).value.trim();
if(!name){alert(‘يرجى إدخال اسم المادة’);return;}
await addDoc(collection(db,‘subjects’),{name,teacher:document.getElementById(‘sTeacher’).value,grade:document.getElementById(‘sGrade’).value,icon:document.getElementById(‘sIcon’).value||‘📖’,createdAt:serverTimestamp()});
closeModal();showToast(‘✅ تم إضافة المادة’);showSubjects();
};
window.deleteSubject=async id=>{if(!confirm(‘حذف المادة؟’))return;await deleteDoc(doc(db,‘subjects’,id));showToast(‘🗑️ تم’);showSubjects();};

// ============ EXAMS ============
window.showSubjectExams=async(subjectId,subjectName)=>{
setBreadcrumb(`المواد › ${subjectName}`);
const snap=await getDocs(query(collection(db,‘exams’),where(‘subjectId’,’==’,subjectId)));
const now=new Date();
let html=`<div class="section-header"><h2>📝 اختبارات: ${subjectName}</h2> <button class="btn-gold" onclick="showCreateExam('${subjectId}','${subjectName}')">+ اختبار جديد</button></div>`;
if(snap.empty){html+=’<div class="empty-msg">لا توجد اختبارات</div>’;}
else snap.forEach(d=>{
const e=d.data();
const o=e.openAt?new Date(e.openAt):null,cl=e.closeAt?new Date(e.closeAt):null;
let st=‘⚪ غير محدد’,sc=’’;
if(o&&cl){if(now<o){st=‘🔵 لم يفتح’;sc=‘status-upcoming’;}else if(now>cl){st=‘🔴 انتهى’;sc=‘status-closed’;}else{st=‘🟢 مفتوح’;sc=‘status-open’;}}
html+=listItem(e.title,`${e.questions?.length||0} سؤال | ${o?'يفتح: '+o.toLocaleString('ar-SA'):''}`,
`<span class="status-badge ${sc}">${st}</span> <button class="btn-sm btn-green" onclick="showExamResults('${d.id}','${e.title}')">النتائج</button> <button class="btn-sm btn-gold" onclick="editExam('${d.id}','${subjectId}','${subjectName}')">تعديل</button> <button class="btn-sm btn-red" onclick="deleteExam('${d.id}','${subjectId}','${subjectName}')">حذف</button>`);
});
C(html);
};

window.showAllExams=async()=>{
setBreadcrumb(‘جميع الاختبارات’);
const [snap,subSnap]=await Promise.all([getDocs(collection(db,‘exams’)),getDocs(collection(db,‘subjects’))]);
const subjects={};subSnap.forEach(d=>subjects[d.id]=d.data().name);
const now=new Date();
let html=’<div class="section-header"><h2>📝 جميع الاختبارات</h2></div>’;
if(snap.empty)html+=’<div class="empty-msg">لا توجد اختبارات</div>’;
snap.forEach(d=>{
const e=d.data();const o=e.openAt?new Date(e.openAt):null,cl=e.closeAt?new Date(e.closeAt):null;
let st=‘⚪’,sc=’’;
if(o&&cl){if(now<o){st=‘🔵 لم يفتح’;sc=‘status-upcoming’;}else if(now>cl){st=‘🔴 انتهى’;sc=‘status-closed’;}else{st=‘🟢 مفتوح’;sc=‘status-open’;}}
html+=listItem(e.title,`المادة: ${subjects[e.subjectId]||'—'} | ${e.questions?.length||0} سؤال`,
`<span class="status-badge ${sc}">${st}</span> <button class="btn-sm btn-green" onclick="showExamResults('${d.id}','${e.title}')">النتائج</button>`);
});

window.showSchedule=async()=>{
setBreadcrumb(‘جدول الاختبارات’);
const [snap,subSnap]=await Promise.all([getDocs(collection(db,‘exams’)),getDocs(collection(db,‘subjects’))]);
const subjects={};subSnap.forEach(d=>subjects[d.id]=d.data());
const now=new Date();
const upcoming=[],open=[],past=[];
snap.forEach(d=>{const e={…d.data(),id:d.id};const o=e.openAt?new Date(e.openAt):null,cl=e.closeAt?new Date(e.closeAt):null;
if(o&&cl){if(now<o)upcoming.push(e);else if(now>cl)past.push(e);else open.push(e);}else upcoming.push(e);});
upcoming.sort((a,b)=>new Date(a.openAt)-new Date(b.openAt));
let html=’<div class="section-header"><h2>📅 جدول الاختبارات</h2></div>’;
if(open.length){html+=`<h3 class="sched-title green">🟢 مفتوحة الآن (${open.length})</h3>`;
open.forEach(e=>{html+=schedRow(e,subjects[e.subjectId],‘open’);});}
if(upcoming.length){html+=`<h3 class="sched-title blue">🔵 القادمة (${upcoming.length})</h3>`;
upcoming.forEach(e=>{html+=schedRow(e,subjects[e.subjectId],‘upcoming’);});}
if(past.length){html+=`<h3 class="sched-title gray">⚫ المنتهية (${past.length})</h3>`;
past.slice(0,5).forEach(e=>{html+=schedRow(e,subjects[e.subjectId],‘past’);});}
if(!open.length&&!upcoming.length&&!past.length)html+=’<div class="empty-msg">لا توجد اختبارات مجدولة</div>’;
C(html);
};

  </div>`;
}

let html=`<div class="section-header"><h2>📊 نتائجي</h2><button class="btn-sm btn-green" onclick="showStudentDashboard()">← رجوع</button></div>`;
if(snap.empty){html+=’<div class="empty-msg">لم تشارك في أي اختبار بعد</div>’;C(html);return;}
const results=[];snap.forEach(d=>results.push(d.data()));
const avg=results.length?(results.reduce((s,a)=>s+(a.total?Math.round((a.score||0)/a.total*100):0),0)/results.length).toFixed(0):0;
html+=`<div class="stats-summary">
<div class="stat-box"><div class="stat-num">${results.length}</div><div class="stat-lbl">اختبار</div></div>
<div class="stat-box gold"><div class="stat-num">${avg}%</div><div class="stat-lbl">المتوسط</div></div>

  </div>
  <table class="results-table"><thead><tr><th>الاختبار</th><th>المادة</th><th>الدرجة</th><th>النسبة</th></tr></thead><tbody>`;
  results.forEach(a=>{const exam=exams[a.examId];const pct=a.total?Math.round((a.score||0)/a.total*100):0;
    html+=`<tr><td>${exam?.title||'—'}</td><td>${subjects[exam?.subjectId]||'—'}</td><td>${a.score||0}/${a.total||0}</td><td><span class="pct-pill ${pct>=60?'pass':'fail'}">${pct}%</span></td></tr>`;
  });
  html+='</tbody></table>';C(html);
};

window.startExam=async examId=>{
const snap=await getDoc(doc(db,‘exams’,examId));if(!snap.exists())return;
const exam=snap.data();const now=new Date();
const cl=exam.closeAt?new Date(exam.closeAt):null;
if(cl&&now>cl){alert(‘انتهى وقت الاختبار’);return;}
const prev=await getDocs(query(collection(db,‘answers’),where(‘examId’,’==’,examId),where(‘studentUid’,’==’,currentUser.uid)));
if(!prev.empty){alert(‘أجبت على هذا الاختبار من قبل’);viewMyResult(examId);return;}
showExamInterface(examId,exam);
};

function showExamInterface(examId,exam){
setBreadcrumb(‘الاختبار: ‘+exam.title);
let remaining=exam.duration?exam.duration*60:null;
const cl=exam.closeAt?new Date(exam.closeAt):null;
let html=`<div class="exam-interface"><div class="exam-top"><h2>${exam.title}</h2><div id="examTimer" class="exam-timer">${remaining?formatTime(remaining):''}</div></div><form id="examForm">`;
exam.questions.forEach((q,i)=>{
const lbl={mcq:‘اختيار’,tf:‘ص/خ’,fill:‘فراغ’,essay:‘مقالي’}[q.type];
html+=`<div class="exam-question"><div class="q-num-badge">س${i+1} <span class="q-type-sm">${lbl}</span> <span class="q-pts">${q.points||1} درجة</span></div><div class="q-text">${q.text}</div>`;
if(q.type===‘mcq’)[‘a’,‘b’,‘c’,‘d’].forEach(o=>{if(q[o])html+=`<label class="choice-label"><input type="radio" name="q_${q.id}" value="${o}"> ${q[o]}</label>`;});
else if(q.type===‘tf’)html+=`<label class="choice-label"><input type="radio" name="q_${q.id}" value="true"> صح</label><label class="choice-label"><input type="radio" name="q_${q.id}" value="false"> خطأ</label>`;
else if(q.type===‘fill’)html+=`<input class="inp" name="q_${q.id}" placeholder="إجابتك">`;
else if(q.type===‘essay’)html+=`<textarea class="inp" name="q_${q.id}" rows="4" placeholder="إجابتك"></textarea>`;
html+=’</div>’;
});
html+=`</form><button class="btn-gold btn-large" onclick="submitExam('${examId}')">تسليم الاختبار ✓</button></div>`;
C(html);
if(remaining){const t=setInterval(()=>{remaining–;const el=document.getElementById(‘examTimer’);if(el)el.textContent=formatTime(remaining);if(remaining<=0){clearInterval(t);submitExam(examId);}},1000);}
if(cl){const t=setInterval(()=>{if(new Date()>cl){clearInterval(t);submitExam(examId);}},30000);}
}

window.submitExam=async examId=>{
if(!confirm(‘هل تريد التسليم؟’))return;
const snap=await getDoc(doc(db,‘exams’,examId));const exam=snap.data();
const form=document.getElementById(‘examForm’);
let score=0,total=0;const answers=[];
exam.questions.forEach(q=>{
const pts=parseInt(q.points)||1;total+=pts;
let ans=null,isCorrect=false;
if(q.type===‘mcq’||q.type===‘tf’){const c=form.querySelector(`input[name="q_${q.id}"]:checked`);ans=c?c.value:null;isCorrect=ans===q.correct;}
else if(q.type===‘fill’){const inp=form.querySelector(`input[name="q_${q.id}"]`);ans=inp?inp.value.trim():’’;isCorrect=ans.toLowerCase()===(q.correct||’’).toLowerCase();}
else if(q.type===‘essay’){const ta=form.querySelector(`textarea[name="q_${q.id}"]`);ans=ta?ta.value.trim():’’;isCorrect=false;}
if(isCorrect)score+=pts;
answers.push({qid:q.id,answer:ans,isCorrect,points:pts});
});
await addDoc(collection(db,‘answers’),{examId,studentUid:currentUser.uid,studentName:userProfile?.name||’—’,studentId:userProfile?.studentId||’—’,answers,score,total,submittedAt:new Date().toISOString()});
const pct=Math.round(score/total*100);
C(`<div class="result-screen"><div class="result-circle ${pct>=60?'pass':'fail'}"><div class="result-pct">${pct}%</div><div class="result-grade">${score}/${total}</div></div> <h2>${pct>=60?'🎉 أحسنت!':'📚 استمر في المذاكرة'}</h2> <p>حصلت على <b>${score}</b> من <b>${total}</b> درجة</p> <button class="btn-gold" onclick="showStudentDashboard()">← العودة</button></div>`);
};

window.viewMyResult=async examId=>{
const snap=await getDocs(query(collection(db,‘answers’),where(‘examId’,’==’,examId),where(‘studentUid’,’==’,currentUser.uid)));
if(snap.empty){alert(‘لا توجد نتيجة’);return;}
const a=snap.docs[0].data();const pct=Math.round((a.score||0)/(a.total||1)*100);
C(`<div class="result-screen"><div class="result-circle ${pct>=60?'pass':'fail'}"><div class="result-pct">${pct}%</div><div class="result-grade">${a.score}/${a.total}</div></div> <h2>نتيجتك</h2><p><b>${a.score}</b> من <b>${a.total}</b></p> <button class="btn-gold" onclick="showStudentDashboard()">← العودة</button></div>`);
};

// ============ UTILS ============
function C(html){document.getElementById(‘mainContent’).innerHTML=html;}
function M(html){const m=document.getElementById(‘modal’);m.innerHTML=`<div class="modal-box large">${html}</div>`;m.style.display=‘flex’;}
function setBreadcrumb(t){document.getElementById(‘breadcrumb’).textContent=t;}
window.closeModal=()=>{document.getElementById(‘modal’).style.display=‘none’;qCount=0;};
function showErr(id,msg){const el=document.getElementById(id);if(el){el.textContent=msg;el.style.display=‘block’;}}
window.showToast=msg=>{const t=document.getElementById(‘toast’);t.textContent=msg;t.classList.add(‘show’);setTimeout(()=>t.classList.remove(‘show’),3000);};
window.toggleDetail=id=>{const el=document.getElementById(id);el.style.display=el.style.display===‘none’?‘block’:‘none’;};
function formatTime(s){return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function listItem(title,sub,actions){return`<div class="list-item"><div class="list-item-info"><div class="list-item-title">${title}</div><div class="list-item-sub">${sub}</div></div><div class="list-item-actions">${actions}</div></div>`;}
function translateErr(c){return({‘auth/invalid-credential’:‘إيميل أو كلمة مرور خاطئة’,‘auth/user-not-found’:‘الحساب غير موجود’,‘auth/wrong-password’:‘كلمة المرور خاطئة’})[c]||’خطأ: ’+c;}
</script>

/* EXAM */
.exam-interface{max-width:680px;margin:0 auto}
.exam-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:13px 16px;background:var(--g);border-radius:11px;color:white}
.exam-top h2{font-size:1rem;font-weight:900;color:var(--gold2)}
.exam-timer{font-size:1.3rem;font-weight:900;color:var(--gold2)}
.exam-question{background:white;border-radius:11px;padding:15px 17px;margin-bottom:11px;border:1.5px solid #e5e7eb}
.q-num-badge{font-size:0.75rem;font-weight:700;color:var(--g2);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.q-type-sm{background:#e8f5e9;border-radius:20px;padding:2px 7px;font-size:0.65rem}
.q-pts{background:#fef3c7;border-radius:20px;padding:2px 7px;font-size:0.65rem;color:#92400e}
.q-text{font-size:0.92rem;font-weight:600;color:#1a1a1a;margin-bottom:9px;line-height:1.5}
.choice-label{display:flex;align-items:center;gap:7px;padding:8px 11px;border:1.5px solid #e5e7eb;border-radius:8px;margin-bottom:5px;cursor:pointer;transition:all .15s;font-size:0.85rem}
.choice-label:hover{border-color:var(--gold);background:#fffbf0}
.choice-label input{accent-color:var(--gold)}
.subject-card{background:white;border-radius:13px;padding:15px;margin-bottom:13px;border:1.5px solid #e5e7eb}
.subject-title{font-size:1rem;font-weight:900;color:var(--g);margin-bottom:2px}
.subject-teacher{font-size:0.72rem;color:#888;margin-bottom:11px}
.exam-row{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:#f8faf8;border-radius:9px;margin-bottom:6px;border:1px solid #e8e8e8}
.exam-name{font-size:0.85rem;font-weight:700;color:var(--g)}
.exam-time{font-size:0.68rem;color:#999;margin-top:2px}
.result-screen{text-align:center;padding:36px 18px}
.result-circle{width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 18px;border:5px solid}
.result-circle.pass{border-color:#16a34a;background:#dcfce7}
.result-circle.fail{border-color:#dc2626;background:#fee2e2}
.result-pct{font-size:2rem;font-weight:900;color:var(--g)}
.result-grade{font-size:0.85rem;color:#666}
.result-screen h2{font-size:1.2rem;font-weight:900;color:var(--g);margin-bottom:7px}
.result-screen p{color:#666;margin-bottom:18px}
.pct-pill{border-radius:20px;padding:3px 10px;font-size:0.75rem;font-weight:700}
.pct-pill.pass{background:#dcfce7;color:#16a34a}
.pct-pill.fail{background:#fee2e2;color:#dc2626}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--g);color:white;padding:9px 22px;border-radius:50px;font-size:0.8rem;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,0.2);border:1.5px solid var(--gold);z-index:9998;transition:transform .3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:600px){.stats-summary{grid-template-columns:1fr 1fr}.list-item{flex-direction:column;align-items:flex-start;gap:8px}.list-item-actions{width:100%}.row-2{grid-template-columns:1fr}}
</style>

</head>
<body>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"></div>
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-emblem">🕌</div>
    <div class="login-title">مدرسة عبيدة بن الحارث</div>
    <div class="login-sub">نظام الاختبارات الإلكترونية</div>
    <div class="login-tabs">
      <button class="tab-btn active" id="teacherTab" onclick="switchLoginTab('teacher')">معلم / مدير</button>
      <button class="tab-btn" id="studentTab" onclick="switchLoginTab('student')">طالب</button>
    </div>
    <div id="teacherPanel">
      <input class="inp" id="lEmail" type="email" placeholder="البريد الإلكتروني" dir="ltr">
      <input class="inp" id="lPass" type="password" placeholder="كلمة المرور" dir="ltr">
      <div class="l-err" id="loginErr"></div>
      <button class="l-btn" onclick="doLogin()">🔐 دخول</button>
    </div>
    <div id="studentPanel" style="display:none">
      <input class="inp" id="studentId" type="number" placeholder="رقم الهوية (10 أرقام)" dir="ltr">
      <input class="inp" id="studentName" type="text" placeholder="الاسم الكامل">
      <div class="l-err" id="studentErr"></div>
      <button class="l-btn" onclick="doStudentLogin()">▶ دخول الطالب</button>
    </div>
  </div>
</div>
<div id="app">
  <div class="top-bar">
    <div>
      <div class="top-logo">🕌 نظام الاختبارات</div>
      <div class="breadcrumb" id="breadcrumb">لوحة التحكم</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div>
        <div class="user-chip" id="userNameBar">—</div>
        <div style="font-size:0.62rem;color:rgba(255,255,255,0.5);text-align:center;margin-top:2px" id="userRoleBar"></div>
      </div>
      <button class="logout-btn" onclick="doLogout()">خروج</button>
    </div>
  </div>
  <div class="main-content" id="mainContent"><div class="loading">⏳ جاري التحميل...</div></div>
</div>
</body>
</html>
